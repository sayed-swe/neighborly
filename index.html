<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Neighborly — connect with the people who live around you." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>try{var th=localStorage.getItem('nb-theme')||'system';document.documentElement.dataset.theme=th==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):th}catch(e){}</script>
    <script>
      // If the app has not drawn anything after a few seconds, show a message instead of a blank page.
      setTimeout(function () {
        var r = document.getElementById('root');
        if (r && !r.children.length) {
          r.innerHTML = '<div style="font-family:system-ui,sans-serif;max-width:520px;margin:12vh auto;padding:0 20px;line-height:1.5">'
            + '<h1 style="margin:0 0 8px">Neighborly could not start</h1>'
            + '<p>Please reload the page. If it stays blank and you manage this site: on GitHub open <b>Settings \u2192 Pages</b> and set <b>Source</b> to <b>GitHub Actions</b>. '
            + 'With \u201cDeploy from a branch\u201d GitHub publishes the raw source files, which cannot run in a browser.</p></div>';
        }
      }, 6000);
    </script>
    <title>Neighborly — your neighborhood, connected</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
